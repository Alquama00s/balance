databaseChangeLog:
  - property:
        name: table
        value: privileges
  - changeSet:
        id: privilege-1768571204
        author: alquama00s
        changes:
          - createTable:
                ifNotExists: true
                tableName: privileges
                columns:
                  - column:
                        name: id
                        type: uuid
                        defaultValueComputed: uuidv7()
                  - column:
                        name: name
                        type: varchar(100)
                        constraints:
                            nullable: false
                            unique: true
                  - column:
                        name: description
                        type: text
          - createTable:
                tableName: role_privilege
                columns:
                  - column:
                        name: role_id
                        type: uuid
                  - column:
                        name: privilege_id
                        type: uuid
          - sql:
                  comment: add the application schema named balance
                  sql: | 
                        GRANT ALL ON Table privileges TO backend;
                        GRANT ALL ON Table role_privilege TO backend;
                  stripComments: false
databaseChangeLog:
  - property:
        name: table
        value: users
  - changeSet:
        id: users-1768561362
        author: alquama00s
        changes:
          - createTable:
                ifNotExists: true
                tableName: users
                columns:
                  - column:
                        name: id
                        type: uuid
                        defaultValueComputed: uuidv7()
                  - column:
                        name: username
                        type: varchar(255)
                        constraints:
                            nullable: false
                            unique: true
                  - column:
                        name: email
                        type: varchar(255)
                        constraints:
                            nullable: false
                            unique: true
                  - column:
                        name: password_hash
                        type: varchar(255)
                        constraints:
                            nullable: false
          - sql:
                  comment: add the application schema named balance
                  sql: | 
                        GRANT ALL ON Table users TO backend;
                  stripComments: false
